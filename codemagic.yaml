workflows:
  android-release-pipeline:
    name: ShiftDrop Android Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Clean Cache and Build APK
        script: |
          # Codemagic සර්වර් එකේ කැෂි වූ පරණ බිල් ඩේටා සම්පූර්ණයෙන්ම ඉවත් කිරීම
          rm -rf build/
          rm -rf android/.gradle/
          flutter clean
          flutter pub get
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
