workflows:
  android-release-pipeline:
    name: ShiftDrop Android Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        # ⚠️ Codemagic UI එකේ (App Settings > Environment variables) "google_api" කියලා Group
        # එකක් හදලා, GOOGLE_API_KEY කියලා Variable එකක් "Secure" ලෙස Mark කරලා Add කරන්න.
        # Key එක Codemagic UI එකේ Encrypted ලෙසයි Save වෙන්නේ, මේ file එකේ Plain Text එකෙන් නෑ.
        - google_api
    scripts:
      - name: Create Android Native Files and Build
        script: |
          # Flutter project එකට නැතිවුණු android ෆෝල්ඩරය නැවත සාදා ගැනීම
          flutter create . --platforms=android
          flutter pub get

          # App module (android/app) compileSdk එක 36ට force කරනවා
          sed -i '' 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts

          # file_picker වගේ Plugin/Library modules ටත් compileSdk 36ට force කරනවා
          # (flutter_plugin_android_lifecycle requirement එකට, plugin එකේම build.gradle එකට
          # අපිට access නැති නිසා, root build.gradle.kts එකෙන් subprojects ඔක්කොම override කරනවා)
          cat >> android/build.gradle.kts << 'EOF'

          subprojects {
              plugins.withId("com.android.library") {
                  extensions.configure<com.android.build.gradle.LibraryExtension> {
                      compileSdk = 36
                  }
              }
          }
          EOF

          flutter build appbundle --release --dart-define=GOOGLE_API_KEY=$GOOGLE_API_KEY
          flutter build apk --release --dart-define=GOOGLE_API_KEY=$GOOGLE_API_KEY
    artifacts:
      - build/app/outputs/**/*.aab
      - build/app/outputs/**/*.apk
