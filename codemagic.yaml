workflows:
  android-release-pipeline:
    name: ShiftDrop Android Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        # ⚠️ Codemagic UI එකේ (App Settings > Environment variables) "google_api" කියලා Group
        # එකක් හදලා, GOOGLE_API_KEY කියලා Variable එකක් "Secure" ලෙස Mark කරලා Add කරන්න.
        # Key එක Codemagic UI එකේ Encrypted ලෙසයි Save වෙන්නේ, මේ file එකේ Plain Text එකෙන් නෑ.
        - google_api
        # Note: google-services.json එක දැනටමත් Git Repo එකට Direct Commit කරලා තියෙන නිසා,
        # "firebase" කියලා Env Variable Group එකක් මෙතන අවශ්‍ය නෑ. පස්සේ Secure Injection
        # (Repo එකෙන් File එක අයින් කරලා) එකට මාරු වෙන්න ඕන නම්, Codemagic UI එකේ "firebase"
        # කියලා Group එකක් හදලා, GOOGLE_SERVICES_JSON කියලා Variable එකක් "Secure" ලෙස Add
        # කරලා, පහත Line එකේ Comment එක අයින් කරන්න:
        # - firebase
    scripts:
      - name: Create Android Native Files and Build
        script: |
          # Flutter project එකට නැතිවුණු android ෆෝල්ඩරය නැවත සාදා ගැනීම
          # (android/app/build.gradle සහ AndroidManifest.xml දැනටමත් Repo එකේ තියෙන නිසා,
          # flutter create ඒවාට අත ගාන්නේ නෑ - Missing Files විතරයි හදන්නේ)
          flutter create . --platforms=android
          flutter pub get

          # settings.gradle.kts එකේ "com.google.gms.google-services" Plugin එකේ Version එක
          # flutter create එකෙන් Auto දෙන්නේ නෑ - ඒක නිසා අපිම මේ File එක සම්පූර්ණයෙන්ම
          # Correct Content එකකින් Overwrite කරනවා (Firebase Build Fail වීම වළක්වන්න)
          # (Note: අලුත් Flutter versions වල flutter create එකෙන් හදන්නේ settings.gradle.kts -
          # Kotlin DSL - Groovy settings.gradle එක නෙවෙයි. දෙකම එකවර තිබ්බොත් Gradle
          # "unsupported project" error එකක් දෙනවා, ඒක නිසා .kts එකම overwrite කරලා,
          # පරණ Groovy file එක තියෙනවනම් delete කරනවා.)
          cat > android/settings.gradle.kts << 'EOF'
          pluginManagement {
              val flutterSdkPath = run {
                  val properties = java.util.Properties()
                  file("local.properties").inputStream().use { properties.load(it) }
                  val flutterSdkPath = properties.getProperty("flutter.sdk")
                  require(flutterSdkPath != null) { "flutter.sdk not set in local.properties" }
                  flutterSdkPath
              }

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id("dev.flutter.flutter-plugin-loader") version "1.0.0"
              id("com.android.application") version "8.3.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              id("com.google.gms.google-services") version "4.4.2" apply false
          }

          include(":app")
          EOF

          # පරණ Groovy settings.gradle එකක් repo එකේ ඉතුරු වෙලා තියෙනවනම්
          # (duplicate/conflict වළක්වන්න) අයින් කරනවා
          rm -f android/settings.gradle

          # ⚠️ android/build.gradle සහ android/app/build.gradle (Groovy) දෙකම
          # දැනටමත් Repo එකේ Commit කරලා තියෙන නිසා (Custom Firebase/Signing/
          # applicationId Config එක්ක), flutter create එකෙන් අලුතෙන් හදපු
          # build.gradle.kts (Kotlin DSL, Blank Template) Duplicate File දෙක
          # අයින් කරනවා - නැත්නම් Gradle එකට Module එකකට Build File 2ක් (Groovy
          # + Kotlin) පේනවා, ඒකෙන් "unsupported Gradle project" Error එක එනවා
          rm -f android/build.gradle.kts
          rm -f android/app/build.gradle.kts

          # ⚠️ flutter create එකෙන් Default Org Name එකේ ("com.example") MainActivity.kt
          # එකක් හදනවා, ඒත් build.gradle එකේ Real Namespace/applicationId එක
          # "lk.shiftdrop.courier". Package Mismatch එක නිසා Gradle එකට Correct
          # Namespace එක ඇතුළේ v2 FlutterActivity එකක් හම්බ වෙන්නේ නෑ - ඒකෙන් "deleted
          # Android v1 embedding" Error එක එනවා. ඒක නිසා Correct Namespace Path එකේම
          # MainActivity.kt අලුතෙන් හදලා, වැරදි com.example Folder එක Delete කරනවා
          mkdir -p android/app/src/main/kotlin/lk/shiftdrop/courier
          cat > android/app/src/main/kotlin/lk/shiftdrop/courier/MainActivity.kt << 'EOF'
          package lk.shiftdrop.courier

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity : FlutterActivity()
          EOF
          rm -rf android/app/src/main/kotlin/com

          # Google Maps (Location Picker) එකට ඕන API Key එක, AndroidManifest.xml එකේ
          # Placeholder එක වෙනුවට Real Key එකෙන් Build Time එකේදී Replace කිරීම
          # (--dart-define එකෙන් Dart Code එකට විතරයි Key එක යන්නේ, Native Manifest එකට යන්නේ නෑ)
          # (Note: mac_mini_m2 instance එක macOS/BSD sed එකක් නිසා -i එකට empty backup
          # suffix argument එකක් '' විදිහට දෙන්න ඕන - Linux GNU sed syntax එකෙන් fail වෙනවා)
          sed -i '' "s|GOOGLE_API_KEY_PLACEHOLDER|$GOOGLE_API_KEY|g" android/app/src/main/AndroidManifest.xml

          # Firebase එකට ඕන google-services.json File එක - දැනටමත් Repo එකේ Commit කරලා තියෙනවා
          # නම් මේ Step එකට කිසි Harm එකක් නෑ (Skip වෙනවා විතරයි). GOOGLE_SERVICES_JSON Env
          # Variable එකක් Set කරලා තියෙනවා නම් විතරයි, ඒකෙන් File එක Overwrite කරන්නේ (Empty
          # File එකකින් Committed File එක අනතුරේ නොවෙන්න)
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo $GOOGLE_SERVICES_JSON | base64 --decode > android/app/google-services.json
          fi
          flutter build appbundle --release --dart-define=GOOGLE_API_KEY=$GOOGLE_API_KEY
          flutter build apk --release --dart-define=GOOGLE_API_KEY=$GOOGLE_API_KEY
    artifacts:
      - build/app/outputs/**/*.aab
      - build/app/outputs/**/*.apk
